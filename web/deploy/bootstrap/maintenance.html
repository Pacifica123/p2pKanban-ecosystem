<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>p2pKanban обновляется</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #eef1f5; color: #17202a; }
      main { width: min(520px, calc(100% - 32px)); padding: 28px; border: 1px solid #d5dbe3; border-radius: 14px; background: #fff; box-shadow: 0 18px 54px rgba(23, 32, 42, .08); }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0 0 18px; color: #596575; line-height: 1.5; }
      progress { display: block; width: 100%; height: 10px; accent-color: #2367d1; }
      small { display: block; min-height: 38px; margin-top: 12px; color: #697689; }
      button { width: 100%; margin-top: 18px; padding: 11px 16px; border: 0; border-radius: 8px; background: #2367d1; color: white; font: inherit; cursor: pointer; }
      button[hidden] { display: none; }
      @media (prefers-color-scheme: dark) {
        body { background: #11161d; color: #edf2f8; }
        main { background: #1a212b; border-color: #303b49; }
        p, small { color: #aeb9c7; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Обновляем p2pKanban</h1>
      <p>Адрес узла остаётся прежним. Доски и локальная база не удаляются.</p>
      <progress id="progress" max="100"></progress>
      <small id="status">Ждём запуска новой версии…</small>
      <button id="reload" type="button" hidden>Открыть обновлённую версию</button>
    </main>
    <script>
      const progress = document.querySelector('#progress');
      const status = document.querySelector('#status');
      const reload = document.querySelector('#reload');
      const localHost = location.hostname === '127.0.0.1' || location.hostname === 'localhost';
      let completedJobId = null;

      reload.addEventListener('click', () => {
        if (completedJobId) localStorage.setItem('p2pkanban:update-acknowledged-job', completedJobId);
        location.reload();
      });

      async function check() {
        try {
          if (localHost) {
            const response = await fetch('http://127.0.0.1:8765/v1/status', { cache: 'no-store' });
            if (response.ok) {
              const state = await response.json();
              const job = state.job || {};
              progress.value = Number(job.progress || 0);
              status.textContent = job.message || 'Обновление выполняется…';
              if (job.status === 'succeeded' && job.verified) {
                progress.value = 100;
                completedJobId = job.id || null;
                reload.hidden = false;
                return;
              }
              if (job.status === 'failed') {
                status.textContent = job.error || 'Обновление остановлено; рабочая версия сохранена.';
              }
            }
          }
          const health = await fetch('/healthz', { cache: 'no-store' });
          if (health.ok) {
            progress.value = 100;
            status.textContent = 'Новая версия готова.';
            reload.hidden = false;
            return;
          }
        } catch (_) {
          status.textContent = 'Контейнеры переключаются. Это может занять несколько минут.';
        }
        setTimeout(check, 1000);
      }

      check();
    </script>
  </body>
</html>
