server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 ipv6=off valid=5s;

    location = /gateway-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /maintenance.html {
        internal;
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Updater readiness must see the real upstream status. The generic
    # maintenance fallback below intentionally returns 200 for browser pages.
    location = /healthz {
        set $web_upstream web;
        proxy_pass http://$web_upstream:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        set $web_upstream web;
        proxy_pass http://$web_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 =200 /maintenance.html;
    }
}
