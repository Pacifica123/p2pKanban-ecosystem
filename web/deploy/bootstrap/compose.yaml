services:
  bootstrap-init:
    image: alpine:3.20
    restart: "no"
    # Keep the script in Compose itself: a Windows checkout may convert a
    # bind-mounted *.sh file to CRLF before BusyBox sees it.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -eu
        secrets_dir=/run/p2pkanban-secrets
        mkdir -p "$$secrets_dir"
        umask 077

        generate_hex() {
          od -An -N "$$1" -tx1 /dev/urandom | tr -d ' \n'
        }

        generate_base64() {
          head -c "$$1" /dev/urandom | base64 | tr -d '\r\n'
        }

        ensure_secret() {
          target="$$1"
          byte_count="$$2"
          if [ -s "$$target" ]; then
            return
          fi
          temporary="$${target}.tmp.$$$$"
          generate_hex "$$byte_count" > "$$temporary"
          printf '\n' >> "$$temporary"
          chmod 0444 "$$temporary"
          mv "$$temporary" "$$target"
        }

        ensure_secret "$$secrets_dir/postgres-password" 32
        ensure_secret "$$secrets_dir/jwt-secret" 64
        ensure_secret "$$secrets_dir/nostr-secret-key" 32

        if [ ! -s "$$secrets_dir/nostr-master-key" ]; then
          temporary="$$secrets_dir/nostr-master-key.tmp.$$$$"
          generate_base64 32 > "$$temporary"
          printf '\n' >> "$$temporary"
          chmod 0444 "$$temporary"
          mv "$$temporary" "$$secrets_dir/nostr-master-key"
        fi

        schema_target="$$secrets_dir/schema-version"
        schema_temporary="$${schema_target}.tmp.$$$$"
        printf '2\n' > "$$schema_temporary"
        chmod 0444 "$$schema_temporary"
        mv -f "$$schema_temporary" "$$schema_target"
        echo "p2pKanban bootstrap secrets are ready."
    volumes:
      - bootstrap_secrets:/run/p2pkanban-secrets
    networks:
      - internal

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      bootstrap-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: p2pkanban
      POSTGRES_USER: p2pkanban
      POSTGRES_PASSWORD_FILE: /run/p2pkanban-secrets/postgres-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - bootstrap_secrets:/run/p2pkanban-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p2pkanban -d p2pkanban"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - internal

  backend:
    image: p2pkanban/backend:${P2PKANBAN_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/bootstrap/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      bootstrap-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      APP__NAME: p2p-kanban-backend
      APP__ENV: local
      APP__HOST: 0.0.0.0
      APP__PORT: 18080
      APP__LOG_FORMAT: json
      DATABASE__MAX_CONNECTIONS: 20
      DATABASE__MIN_CONNECTIONS: 1
      DATABASE__CONNECT_TIMEOUT_SECS: 10
      HTTP__BODY_LIMIT_MB: 16
      HTTP__CORS_ALLOWED_ORIGINS: http://127.0.0.1:${P2PKANBAN_WEB_PORT:-8080},http://localhost:${P2PKANBAN_WEB_PORT:-8080}
      AUTH__PREVIOUS_JWT_SECRETS: ""
      AUTH__ACCESS_TOKEN_TTL_MINUTES: 15
      AUTH__REFRESH_TOKEN_TTL_DAYS: 30
      AUTH__PUBLIC_SIGNUP_ENABLED: "true"
      AUTH__REFRESH_COOKIE_NAME: p2p_kanban_refresh
      AUTH__DEVICE_COOKIE_NAME: p2p_kanban_device
      AUTH__COOKIE_SAME_SITE: lax
      AUTH__COOKIE_SECURE: "false"
      AUTH__ENABLE_DEV_HEADER_AUTH: "false"
      AUTH__AUTH_RATE_LIMIT_WINDOW_SECS: 60
      AUTH__AUTH_RATE_LIMIT_MAX_ATTEMPTS: 20
      AUTH__SENSITIVE_RATE_LIMIT_WINDOW_SECS: 60
      AUTH__SENSITIVE_RATE_LIMIT_MAX_ATTEMPTS: 60
      TRANSPORTS__NOSTR__ENABLED: "true"
      TRANSPORTS__NOSTR__RELAYS: "${P2PKANBAN_NOSTR_RELAYS:-wss://relay.damus.io,wss://nos.lol,wss://relay.primal.net}"
      TRANSPORTS__NOSTR__EVENT_KIND: "1978"
      TRANSPORTS__NOSTR__FETCH_TIMEOUT_SECS: "10"
      TRANSPORTS__NOSTR__MIN_RELAY_ACKS: "${P2PKANBAN_NOSTR_MIN_RELAY_ACKS:-2}"
      TRANSPORTS__NOSTR__BACKFILL_ON_START: "true"
      TRANSPORTS__IROH__ENABLED: "false"
    volumes:
      - bootstrap_secrets:/run/p2pkanban-secrets:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:18080/health"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s
    networks:
      - internal

  web:
    image: p2pkanban/web:${P2PKANBAN_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/bootstrap/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_SOURCE_REVISION: ${P2PKANBAN_SOURCE_REVISION:-unknown}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/healthz"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - internal

  gateway:
    image: p2pkanban/gateway:local
    build:
      context: ../..
      dockerfile: deploy/bootstrap/gateway.Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${P2PKANBAN_BIND_ADDRESS:-127.0.0.1}:${P2PKANBAN_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8080/gateway-health"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - internal

volumes:
  bootstrap_secrets:
  postgres_data:

networks:
  internal:
    driver: bridge
