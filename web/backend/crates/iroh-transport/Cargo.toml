[package]
name = "p2p-kanban-iroh-transport"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Direct QUIC fast path for p2pKanban sync envelopes"

[dependencies]
anyhow = "1"
iroh = "1.0.3"
p2p-kanban-sync-core = { path = "../sync-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
