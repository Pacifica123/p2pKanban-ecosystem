[package]
name = "p2p-kanban-sync-core"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Transport-neutral event contract and merge rules for p2pKanban"

[dependencies]
base64 = "0.22"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = "1"
