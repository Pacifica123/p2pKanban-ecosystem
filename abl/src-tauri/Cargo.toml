[package]
name = "p2pkanban-arch-native"
version = "0.1.0"
description = "Native Arch-based Linux client for p2pKanban"
authors = ["p2pKanban contributors"]
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
rusqlite = { version = "=0.40.2", features = ["bundled", "backup"] }
libc = "=0.2.189"
uuid = { version = "=1.26.1", features = ["v4"] }
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
argon2 = "=0.6.0"
chacha20poly1305 = "=0.10.1"
k256 = { version = "=0.14.0", default-features = false, features = ["schnorr", "getrandom"] }
getrandom = "=0.4.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.22.1"
hmac = "=0.12.1"
sha2 = "=0.10.9"
time = { version = "=0.3.55", features = ["formatting"] }
zbus = { version = "=5.19.0", default-features = false, features = ["blocking-api", "tokio"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
